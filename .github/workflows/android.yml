name: android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pick the version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$(cat android/VERSION)"; TAG="v$V"
          # a second build of the same version gets the run number appended
          if gh release view "$TAG" >/dev/null 2>&1; then TAG="v$V.${{ github.run_number }}"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"; echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"; fi
          gradle --no-daemon assembleRelease
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk "../out/shouzhang-$TAG.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" out/*.apk --target "$GITHUB_SHA" \
            --title "手帐 $TAG（安卓）" \
            --notes "安卓安装包。下载 .apk，在手机上打开安装（第一次需要允许“安装未知来源应用”）。"
