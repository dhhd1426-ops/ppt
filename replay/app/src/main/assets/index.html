<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对话回放</title>
<style>
/* 布局：左滑菜单 → 最近记录列表 → 对话窗口，三层由远到近；底部是回放栏 */
:root{
  --bg:#f4f2ec; --panel:#eae7dd; --ink:#22201c; --muted:#756f64; --line:#d9d4c6;
  --bubble:#e3dfd2; --accent:#2c5f63; --accent-ink:#ffffff; --code:#ece9df; --warn:#a4432b;
  --pill:#22201c; --pill-ink:#f4f2ec;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --font-read:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1a18; --panel:#121211; --ink:#eceae4; --muted:#98958c; --line:#31302c;
    --bubble:#2b2a27; --accent:#86beb6; --accent-ink:#10201f; --code:#242320; --warn:#e58a70;
    --pill:#f1efe9; --pill-ink:#1a1a18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1a18; --panel:#121211; --ink:#eceae4; --muted:#98958c; --line:#31302c;
  --bubble:#2b2a27; --accent:#86beb6; --accent-ink:#10201f; --code:#242320; --warn:#e58a70;
  --pill:#f1efe9; --pill-ink:#1a1a18;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;height:100%;position:relative}
.ib{border:0;background:transparent;border-radius:8px;width:38px;height:38px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--bubble);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}

/* 菜单抽屉 */
.drawer{position:absolute;inset:0 auto 0 0;width:min(86vw,320px);z-index:40;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:10px;transform:translateX(-102%);transition:transform .22s ease;overflow-y:auto}
.app.drawer-open .drawer{transform:none}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 8px 10px}
.brand{font-size:19px;font-weight:650;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:14px;border:0;background:transparent;border-radius:10px;padding:11px 10px;text-align:left;font-size:15px}
.nav-i:hover{background:var(--bubble)}
.nav-i svg{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 10px}
#pasteBox{padding:4px 10px}
#paste{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;font-family:var(--font-mono);font-size:12px;resize:vertical}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}
.app.drawer-open .shade{display:block}

/* 最近记录 */
.pane{width:310px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
.app.nopane .pane{display:none}
.pane-h{display:flex;align-items:center;gap:6px;padding:8px 8px;min-height:54px}
.pane-h h2{flex:1;text-align:center;font-size:15px;font-weight:650;margin:0}
.pane-h.sel span{flex:1;font-size:15px;font-weight:650}
.list{flex:1;overflow-y:auto;padding:4px 8px 84px;min-height:0}
.item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:9px 10px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.item:hover{background:var(--bubble)}
.item.on{background:var(--bubble)}
.item svg{width:17px;height:17px;margin-top:3px;color:var(--muted)}
.item .tx{min-width:0;flex:1}
.item .t{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{display:block;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.box{width:17px;height:17px;border:1.6px solid var(--muted);border-radius:4px;margin-top:3px;flex:none;display:grid;place-items:center}
.item.picked .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.picked .box::after{content:"";width:8px;height:4px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg) translateY(-1px)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;color:var(--muted)}
.more{margin:8px auto;display:block}
.empty{padding:16px 10px;color:var(--muted);font-size:13px}
.fabs{position:absolute;left:14px;right:14px;bottom:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.fabs>*{pointer-events:auto}
.fab{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pill{height:48px;border-radius:24px;border:0;background:var(--pill);color:var(--pill-ink);padding:0 20px 0 16px;font-weight:650;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.searchbar{position:absolute;left:10px;right:10px;bottom:14px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:26px;padding:5px 6px 5px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.searchbar svg{color:var(--muted)}
#search{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:15px;padding:6px 0}
#search::-webkit-search-cancel-button{display:none}
.shade2{display:none}

/* 对话 */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative}
.head{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:54px}
.head-t{min-width:0;flex:1}
.head h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;min-height:0}
.thread{max-width:760px;margin:0 auto;padding:18px 18px 32px;display:flex;flex-direction:column;gap:20px}
.msg{display:flex;flex-direction:column;gap:6px;min-width:0}
.msg.user{align-items:flex-end}
.bubble{background:var(--bubble);border-radius:16px;padding:10px 15px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai .body{font-family:var(--font-read);font-size:16.5px;line-height:1.7;overflow-wrap:anywhere;min-width:0}
.meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.meta .ib{width:30px;height:30px}.meta .ib svg{width:17px;height:17px}
.msg.ai .meta{margin-left:-6px}
.link{border:0;background:transparent;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:2px}
.body>*:first-child{margin-top:0}.body>*:last-child{margin-bottom:0}
.body p{margin:.7em 0}
.body h1,.body h2,.body h3,.body h4{font-family:var(--font-ui);line-height:1.3;margin:1.2em 0 .5em;text-wrap:balance}
.body h1{font-size:1.3em}.body h2{font-size:1.18em}.body h3{font-size:1.06em}.body h4{font-size:1em}
.body ul,.body ol{padding-left:1.4em;margin:.6em 0}
.body li{margin:.25em 0}.body li p{margin:.3em 0}
.body blockquote{margin:.8em 0;padding:.1em 0 .1em 14px;border-left:3px solid var(--line);color:var(--muted)}
.body hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.body a{color:var(--accent)}
.body code{font-family:var(--font-mono);font-size:.86em;background:var(--code);border-radius:4px;padding:.1em .35em}
.tablewrap{overflow-x:auto;margin:.8em 0}
.body table{border-collapse:collapse;font-family:var(--font-ui);font-size:14px}
.body th,.body td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.body th{background:var(--code)}
.code{border:1px solid var(--line);border-radius:10px;margin:.8em 0;overflow:hidden;font-family:var(--font-ui)}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;font-size:12px;color:var(--muted);background:var(--code);border-bottom:1px solid var(--line)}
pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--font-mono);font-size:13px;line-height:1.55;white-space:pre}
pre code{background:none!important;padding:0!important;font-size:inherit!important}
details.fold{border:1px solid var(--line);border-radius:10px;font-family:var(--font-ui);font-size:14px;margin:.7em 0;overflow:hidden}
details.fold>summary{padding:7px 12px;color:var(--muted);cursor:pointer;list-style-position:inside}
details.fold>.in{padding:10px 12px;border-top:1px solid var(--line)}
details.fold>pre{border-top:1px solid var(--line);max-height:320px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
details.think>.in{font-family:var(--font-read);font-size:15px;color:var(--muted);line-height:1.65}
details.err>summary{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;white-space:normal}
.chips:not(:last-child){margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 9px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pic{max-width:100%;max-height:320px;border-radius:8px;display:block}
.msg.sys,.msg.tool{font-size:14px}
.typing{display:flex;gap:5px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite both}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.enter{animation:rise .28s ease-out}
@keyframes rise{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 回放栏 */
.bar{padding:8px 14px 14px}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:28px;padding:6px 16px 6px 6px;background:var(--panel)}
.round{width:42px;height:42px;border-radius:50%;border:0;background:var(--pill);color:var(--pill-ink);display:grid;place-items:center;flex:none}
.round:disabled{opacity:.4}
.round svg{fill:currentColor;stroke:none}
.bar .label{font-size:14px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.bar .btn{border-radius:18px;padding:5px 12px}
.toast{position:absolute;left:50%;top:62px;transform:translateX(-50%);max-width:min(92%,520px);background:var(--pill);color:var(--pill-ink);border-radius:12px;padding:9px 14px;font-size:13.5px;z-index:25;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.err{background:var(--warn);color:#fff}
.sheet-shade{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:50}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;z-index:60;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:18px 18px 22px;display:flex;flex-direction:column;gap:6px;max-height:92%;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 8px;font-size:17px;font-weight:650}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;background:var(--bg);margin-bottom:6px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:14px;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--pill);color:var(--pill-ink);font-weight:650}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;font-size:15px;border-bottom:1px solid var(--line)}
.sw input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.sw.off{opacity:.4}
.sheet .hint{margin:8px 2px}
.sheet-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sheet-btns .btn{flex:1;min-width:104px;padding:11px 12px;border-radius:12px;font-size:15px}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.drop{outline:2px dashed var(--accent);outline-offset:-8px}

@media (max-width:760px){
  .pane{position:absolute;inset:0 auto 0 0;width:min(88vw,340px);z-index:20;transform:translateX(-102%);transition:transform .22s ease}
  .app.nopane .pane{display:flex}
  .app.pane-open .pane{transform:none}
  .shade2{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:15}
  .app.pane-open .shade2{display:block}
  .bubble{max-width:94%}
}
@media (prefers-reduced-motion:reduce){.enter,.typing i{animation:none}.drawer,.pane{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="drawer" id="drawer" aria-label="菜单">
    <div class="drawer-h"><span class="brand">对话回放</span><button class="ib" id="drawerClose" type="button" aria-label="关闭菜单"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="nav">
      <button class="nav-i" id="navImport" type="button"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>导入文件</button>
      <button class="nav-i" id="navPaste" type="button"><svg viewBox="0 0 24 24"><path d="M9 4h6v3H9zM7 5H5v15h14V5h-2"/></svg>粘贴 JSON</button>
      <button class="nav-i" id="navClear" type="button"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg><span id="navClearT">清空全部对话</span></button>
    </nav>
    <div id="pasteBox" hidden>
      <textarea id="paste" placeholder="把接口返回的 JSON 贴在这里" spellcheck="false"></textarea>
      <div style="margin-top:8px"><button class="btn primary" id="pasteGo" type="button">读取</button></div>
    </div>
    <p class="hint">可导入：官方导出的 zip 或 conversations.json、接口返回的单个对话 JSON、API 的 messages 数组、JSONL。</p>
    <p class="hint">文件只在这台设备的浏览器里解析，不会上传。这是一个只读的回放工具，不是 Claude 官方应用。</p>
    <input type="file" id="file" multiple hidden>
  </aside>
  <div class="shade" id="shade"></div>

  <section class="pane" id="pane" aria-label="最近记录">
    <header class="pane-h" id="paneH">
      <button class="ib" id="menu" type="button" aria-label="打开菜单"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h11M4 17h7"/></svg></button>
      <h2>最近记录</h2>
      <button class="ib" id="sort" type="button" aria-label="切换时间排序"><svg viewBox="0 0 24 24"><path d="M4 6h16l-6 7v5l-4 2v-7z"/></svg></button>
    </header>
    <header class="pane-h sel" id="selH" hidden>
      <button class="ib" id="selBack" type="button" aria-label="退出多选"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <span id="selCount">已选择 0 个</span>
      <button class="ib" id="selExp" type="button" aria-label="导出选中的对话"><svg viewBox="0 0 24 24"><path d="M12 15V4M7.500 8.500L12 4l4.500 4.500M5 14v5h14v-5"/></svg></button>
      <button class="ib" id="selDel" type="button" aria-label="删除选中的对话"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>
    </header>
    <div class="list" id="list"></div>
    <div class="fabs" id="fabs">
      <button class="fab" id="searchOpen" type="button" aria-label="搜索对话"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <button class="pill" id="pick" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>导入</button>
    </div>
    <div class="searchbar" id="searchBar" hidden>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input type="search" id="search" placeholder="搜索" autocomplete="off" aria-label="搜索标题或内容">
      <button class="ib" id="searchClose" type="button" aria-label="关闭搜索"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </section>
  <div class="shade2" id="shade2"></div>

  <main class="main">
    <header class="head">
      <button class="ib" id="toggle" type="button" aria-label="显示或收起最近记录"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M9.5 5v14"/></svg></button>
      <div class="head-t"><h1 id="title"></h1><div class="sub" id="sub"></div></div>
    </header>
    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
    <div class="bar">
      <div class="bar-in">
        <button class="round" id="play" type="button" aria-label="从头回放"></button>
        <span class="label" id="count"></span>
        <button class="btn" id="speed" type="button" aria-label="回放速度">1×</button>
        <button class="btn ghost" id="stop" type="button" hidden>显示全部</button>
      </div>
    </div>
    <div class="toast" id="status" role="status" hidden></div>
  </main>
  <div class="sheet-shade" id="sheetShade" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-labelledby="sheetT" hidden>
    <h3 id="sheetT">导出</h3>
    <div class="seg" id="fmt" role="radiogroup" aria-label="文件格式">
      <button type="button" role="radio" data-v="md" aria-checked="true">Markdown</button>
      <button type="button" role="radio" data-v="txt" aria-checked="false">纯文本</button>
      <button type="button" role="radio" data-v="json" aria-checked="false">JSON</button>
    </div>
    <label class="sw"><span>带时间</span><input type="checkbox" id="oTime" checked></label>
    <label class="sw"><span>带思考过程</span><input type="checkbox" id="oThink"></label>
    <label class="sw"><span>带工具调用和附件</span><input type="checkbox" id="oTools"></label>
    <label class="sw" id="oMergeRow"><span>合并成一个文件</span><input type="checkbox" id="oMerge"></label>
    <p class="hint" id="sheetHint"></p>
    <div class="sheet-btns">
      <button class="btn primary" id="expSave" type="button">保存到手机</button>
      <button class="btn" id="expShare" type="button">分享</button>
      <button class="btn" id="expCopy" type="button">复制全文</button>
    </div>
  </section>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Markdown ---------- */
function inline(s){
  const codes=[];
  s=s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g,(m,t,c)=>{codes.push('<code>'+esc(c.trim())+'</code>');return '\u0000'+(codes.length-1)+'\u0000';});
  s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,(m,a)=>'[图片'+(a?'：'+a:'')+']');
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+[^)]*)?\)/g,(m,t,u)=>/^https?:\/\//i.test(u)?'<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+t+'</a>':t);
  s=s.replace(/\*\*([^*\n]+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*\\])\*([^*\s][^*\n]*?)\*(?!\*)/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~\n]+?)~~/g,'<del>$1</del>');
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>codes[+i]||'');
  return s;
}
const RE_FENCE=/^\s*(```+|~~~+)\s*([\w+#.\-]*)/;
const RE_HEAD=/^\s{0,3}(#{1,6})\s+(.*)$/;
const RE_HR=/^\s*([-*_])(\s*\1){2,}\s*$/;
const RE_LI=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const RE_TSEP=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
function codeBlock(code,lang){
  return '<div class="code"><div class="code-h"><span>'+esc(lang||'代码')+'</span><button class="link" type="button" data-copy="code">复制</button></div><pre><code>'+esc(code)+'</code></pre></div>';
}
function cells(l){l=l.trim();if(l.startsWith('|'))l=l.slice(1);if(l.endsWith('|'))l=l.slice(0,-1);return l.split(/(?<!\\)\|/).map(x=>x.trim().replace(/\\\|/g,'|'));}
function listHtml(lines){
  const base=lines[0].match(/^\s*/)[0].length;
  const first=lines[0].match(RE_LI);const ordered=/\d/.test(first[2]);
  const items=[];let cur=null;
  for(const l of lines){
    const m=l.match(RE_LI);
    if(m&&m[1].length<=base+1){cur={text:m[3],sub:[]};items.push(cur);}
    else if(cur)cur.sub.push(l);
  }
  const tag=ordered?'ol':'ul';
  const start=ordered&&parseInt(first[2],10)>1?' start="'+parseInt(first[2],10)+'"':'';
  return '<'+tag+start+'>'+items.map(it=>{
    let h=inline(it.text);
    const real=it.sub.filter(x=>x.trim());
    if(real.length){
      const ind=Math.min(...real.map(x=>x.match(/^\s*/)[0].length));
      h+=md(it.sub.map(x=>x.slice(Math.min(ind,x.match(/^\s*/)[0].length))).join('\n'));
    }
    return '<li>'+h+'</li>';
  }).join('')+'</'+tag+'>';
}
function md(src){
  const lines=String(src).replace(/\u0000/g,'').replace(/\r\n?/g,'\n').split('\n');
  const out=[];let i=0,m;
  const isStart=k=>{const l=lines[k];return RE_FENCE.test(l)||RE_HEAD.test(l)||RE_HR.test(l)||/^\s*>/.test(l)||RE_LI.test(l)||(l.includes('|')&&k+1<lines.length&&RE_TSEP.test(lines[k+1]));};
  while(i<lines.length){
    const l=lines[i];
    if(!l.trim()){i++;continue;}
    if((m=l.match(RE_FENCE))){
      const fence=m[1],buf=[];i++;
      while(i<lines.length&&!lines[i].trim().startsWith(fence)){buf.push(lines[i]);i++;}
      i++;out.push(codeBlock(buf.join('\n'),m[2]));continue;
    }
    if((m=l.match(RE_HEAD))){const lv=Math.min(m[1].length,4);out.push('<h'+lv+'>'+inline(m[2].replace(/\s+#+\s*$/,''))+'</h'+lv+'>');i++;continue;}
    if(RE_HR.test(l)){out.push('<hr>');i++;continue;}
    if(/^\s*>/.test(l)){
      const buf=[];while(i<lines.length&&/^\s*>/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,''));i++;}
      out.push('<blockquote>'+md(buf.join('\n'))+'</blockquote>');continue;
    }
    if(l.includes('|')&&i+1<lines.length&&RE_TSEP.test(lines[i+1])){
      const head=cells(l);i+=2;const rows=[];
      while(i<lines.length&&lines[i].trim()&&lines[i].includes('|')){rows.push(cells(lines[i]));i++;}
      out.push('<div class="tablewrap"><table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+head.map((_,k)=>'<td>'+inline(r[k]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
      continue;
    }
    if(RE_LI.test(l)){
      const buf=[];const m0=l.match(RE_LI),ord0=/\d/.test(m0[2]);
      while(i<lines.length){
        const x=lines[i];const mx=x.match(RE_LI);
        if(mx&&buf.length&&mx[1].length<=m0[1].length+1&&/\d/.test(mx[2])!==ord0)break;
        if(mx||(x.trim()&&/^\s{2,}/.test(x))){buf.push(x);i++;continue;}
        if(!x.trim()&&i+1<lines.length&&(RE_LI.test(lines[i+1])||/^\s{2,}\S/.test(lines[i+1]))){buf.push(x);i++;continue;}
        break;
      }
      out.push(listHtml(buf));continue;
    }
    const buf=[l];i++;
    while(i<lines.length&&lines[i].trim()&&!isStart(i)){buf.push(lines[i]);i++;}
    out.push('<p>'+buf.map(inline).join('<br>')+'</p>');
  }
  return out.join('');
}

/* ---------- 数据归一化 ---------- */
function flat(c){
  if(c==null)return '';
  if(typeof c==='string')return c;
  if(Array.isArray(c))return c.map(x=>x&&typeof x==='object'?(typeof x.text==='string'?x.text:JSON.stringify(x,null,2)):String(x)).join('\n');
  try{return JSON.stringify(c,null,2);}catch(e){return String(c);}
}
function blocksOf(m){
  const out=[];const c=m.content;
  if(typeof c==='string'){if(c)out.push({t:'text',text:c});}
  else if(Array.isArray(c)){
    for(const b of c){
      if(b==null)continue;
      if(typeof b==='string'){out.push({t:'text',text:b});continue;}
      const ty=String(b.type||'');
      if(ty==='text'){if(b.text)out.push({t:'text',text:String(b.text)});}
      else if(ty==='thinking'){if(b.thinking)out.push({t:'think',text:String(b.thinking)});}
      else if(ty==='tool_use'||ty==='server_tool_use'){out.push({t:'tool',name:String(b.name||'tool'),input:b.input});}
      else if(ty.endsWith('tool_result')){out.push({t:'result',name:String(b.name||''),text:flat(b.content),err:!!b.is_error});}
      else if(ty==='image'){
        const s=b.source||{};
        if(s.type==='base64'&&/^image\/(png|jpeg|gif|webp)$/.test(s.media_type||'')&&/^[A-Za-z0-9+/=\s]+$/.test(s.data||''))out.push({t:'img',src:'data:'+s.media_type+';base64,'+s.data.replace(/\s+/g,'')});
        else out.push({t:'file',name:'图片'});
      }
      else if(ty==='document'){out.push({t:'file',name:String(b.title||'文档')});}
    }
  }
  if(!out.some(b=>b.t==='text')&&typeof m.text==='string'&&m.text.trim())out.push({t:'text',text:m.text});
  for(const a of (Array.isArray(m.attachments)?m.attachments:[])){if(a)out.push({t:'file',name:String(a.file_name||'附件'),body:typeof a.extracted_content==='string'?a.extracted_content:''});}
  for(const key of ['files','files_v2']){
    if(key==='files_v2'&&Array.isArray(m.files)&&m.files.length)continue;
    for(const f of (Array.isArray(m[key])?m[key]:[])){if(f)out.push({t:'file',name:String(f.file_name||'文件')});}
  }
  return out;
}
function msgFrom(m){
  if(!m||typeof m!=='object')return null;
  if(m.message&&typeof m.message==='object'&&(m.type==='user'||m.type==='assistant'))m=Object.assign({},m.message,{created_at:m.timestamp});
  const r=String(m.sender||m.role||'').toLowerCase();
  let role=r==='human'||r==='user'?'user':(r==='assistant'||r==='model'||r==='ai')?'assistant':(r==='system'||r==='developer')?'system':null;
  if(!role)return null;
  const blocks=blocksOf(m);
  if(!blocks.length)return null;
  if(role==='user'&&blocks.every(b=>b.t==='result'))role='tool';
  return {role,time:m.created_at||m.timestamp||'',blocks};
}
let seq=0;
function convFrom(o,fallback){
  let raw=o.chat_messages||o.messages||[];
  if(o.current_leaf_message_uuid&&raw.some(m=>m&&m.parent_message_uuid)){
    const map=new Map(raw.map(m=>[m.uuid,m]));const path=[];const seen=new Set();
    let cur=map.get(o.current_leaf_message_uuid);
    while(cur&&!seen.has(cur.uuid)){seen.add(cur.uuid);path.push(cur);cur=map.get(cur.parent_message_uuid);}
    if(path.length)raw=path.reverse();
  }
  const msgs=[];
  const sys=typeof o.system==='string'?o.system:Array.isArray(o.system)?flat(o.system):'';
  if(sys)msgs.push({role:'system',time:'',blocks:[{t:'text',text:sys}]});
  for(const m of raw){const n=msgFrom(m);if(n)msgs.push(n);}
  if(!msgs.length)return null;
  let title=String(o.name||o.title||'').trim();
  if(!title){
    const u=msgs.find(m=>m.role==='user');const tb=u&&u.blocks.find(b=>b.t==='text');
    title=tb?tb.text.trim().replace(/\s+/g,' ').slice(0,40):(fallback||'未命名对话');
  }
  const created=o.created_at||msgs.find(m=>m.time)?.time||'';
  const updated=o.updated_at||[...msgs].reverse().find(m=>m.time)?.time||created;
  return {id:String(o.uuid||o.id||('c'+Date.now()+'-'+(seq++))),title,created,updated,msgs};
}
function normalizeAny(d,name){
  const isObj=x=>x&&typeof x==='object';
  if(Array.isArray(d)){
    if(d.some(x=>isObj(x)&&(Array.isArray(x.chat_messages)||Array.isArray(x.messages)||Array.isArray(x.conversations))))
      return d.filter(isObj).flatMap(x=>{try{return normalizeAny(x,name);}catch(e){return [];}});
    const c=convFrom({messages:d},name);return c?[c]:[];
  }
  if(isObj(d)){
    if(Array.isArray(d.conversations))return normalizeAny(d.conversations,name);
    if(Array.isArray(d.chat_messages)||Array.isArray(d.messages)){const c=convFrom(d,name);return c?[c]:[];}
    if((d.role||d.sender)&&d.content!=null){const c=convFrom({messages:[d]},name);return c?[c]:[];}
  }
  throw new Error('没有认出对话结构');
}
function parseText(text,name){
  text=text.replace(/^﻿/,'').trim();
  if(!text)throw new Error('内容是空的');
  let data;
  try{data=JSON.parse(text);}
  catch(e){
    const rows=[];
    for(const line of text.split('\n')){const s=line.trim();if(!s)continue;try{rows.push(JSON.parse(s));}catch(_){}}
    if(!rows.length)throw new Error('不是有效的 JSON 或 JSONL');
    data=rows;
  }
  return normalizeAny(data,name);
}

/* ---------- zip（浏览器自带解压） ---------- */
function zipEntries(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  let i=u8.length-22;const min=Math.max(0,u8.length-65557);
  for(;i>=min;i--)if(dv.getUint32(i,true)===0x06054b50)break;
  if(i<min)throw new Error('zip 文件不完整');
  const n=dv.getUint16(i+10,true);let p=dv.getUint32(i+16,true);
  if(p===0xFFFFFFFF)throw new Error('这个 zip 太大，请先解压，再导入里面的 conversations.json');
  const td=new TextDecoder();const out=[];
  for(let k=0;k<n&&p+46<=u8.length;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    out.push({name:td.decode(u8.subarray(p+46,p+46+nl)),method,csize,lho});
    p+=46+nl+el+cl;
  }
  return out;
}
async function zipText(buf,e){
  const dv=new DataView(buf);
  const start=e.lho+30+dv.getUint16(e.lho+26,true)+dv.getUint16(e.lho+28,true);
  const data=new Uint8Array(buf,start,e.csize);
  if(e.method===0)return new TextDecoder().decode(data);
  if(e.method!==8)throw new Error('zip 用了不支持的压缩方式');
  if(typeof DecompressionStream==='undefined')throw new Error('这个浏览器不能直接解压 zip，请先解压，再导入里面的 conversations.json');
  return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
}
async function readFile(file){
  const buf=await file.arrayBuffer();
  const u8=new Uint8Array(buf,0,Math.min(4,buf.byteLength));
  if(u8[0]===0x50&&u8[1]===0x4b){
    const all=zipEntries(buf).filter(e=>/\.jsonl?$/i.test(e.name));
    let pick=all.filter(e=>/(^|\/)conversations\.json$/i.test(e.name));
    if(!pick.length)pick=all.filter(e=>!/(^|\/)(users|projects|memories)\.json$/i.test(e.name));
    if(!pick.length)throw new Error('zip 里没有找到 conversations.json');
    const out=[];
    for(const e of pick){try{out.push(...parseText(await zipText(buf,e),e.name));}catch(err){if(pick.length===1)throw err;}}
    return out;
  }
  return parseText(new TextDecoder().decode(buf),file.name.replace(/\.[^.]+$/,''));
}

    return '<div class="msg user">'+(folds?'<div style="width:100%;max-width:88%">'+folds+'</div>':'')+'<div class="bubble">'+(loose?'<div class="chips">'+loose+'</div>':'')+inner+'</div><div class="meta">'+tm+cp+'</div></div>';
  }
  if(m.role==='system')return '<div class="msg sys"><details class="fold"><summary>系统提示词</summary><pre>'+esc(plain)+'</pre></details></div>';
  if(m.role==='tool')return '<div class="msg tool">'+rest.map(b=>blockHtml(b,'tool')).join('')+'</div>';
  return '<div class="msg ai"><div class="body">'+chips+rest.map(b=>blockHtml(b,'assistant')).join('')+'</div><div class="meta">'+cp+tm+'</div></div>';
}
function current(){return data().find(c=>c.id===activeId)||null;}
function renderConv(){
  stopPlay(true);
  const c=current();copyMap.clear();
  if(!c){$('title').textContent='';$('sub').textContent='';$('thread').innerHTML='';updateBar();return;}
  $('title').textContent=c.title;
  $('sub').textContent=[c.sample?'示例对话':'',fmt(c.created),c.msgs.length+' 条消息'].filter(Boolean).join(' · ');
  $('thread').innerHTML=c.msgs.map(msgHtml).join('')+'<div class="typing" id="typing" hidden aria-label="正在输入"><i></i><i></i><i></i></div>';
  const s=$('scroll');s.scrollTop=s.scrollHeight;
  updateBar();
}
function select(id){activeId=id;renderList();renderConv();app.classList.remove('pane-open');}
function refresh(keep){
  const all=data();
  if(!keep||!all.some(c=>c.id===activeId))activeId=all[0]?all[0].id:null;
  renderList();renderConv();
}

/* ---------- 回放 ---------- */
const pb={on:false,paused:false,idx:0,timer:null,speed:1};
const msgEls=()=>[...$('thread').querySelectorAll('.msg')];
const toBottom=()=>{const s=$('scroll');s.scrollTop=s.scrollHeight;};
function updateBar(){
  const n=msgEls().length;const p=$('play');
  const running=pb.on&&!pb.paused;
  p.innerHTML=running?IC.pause:IC.play;
  p.setAttribute('aria-label',!pb.on?'从头回放':pb.paused?'继续回放':'暂停回放');
  p.disabled=!n;
  $('stop').hidden=!pb.on;
  $('count').textContent=pb.on?((pb.paused?'已暂停 · ':'回放中 · ')+'第 '+pb.idx+' / '+n+' 条'):('从头回放 · 共 '+n+' 条消息');
}
function step(){
  const els=msgEls();const typing=$('typing');
  if(pb.idx>=els.length){stopPlay();return;}
  const el=els[pb.idx];
  const show=()=>{
    if(typing)typing.hidden=true;
    el.hidden=false;el.classList.add('enter');pb.idx++;updateBar();toBottom();
    const len=el.textContent.length;
    pb.timer=setTimeout(step,Math.max(700,Math.min(3200,400+len*10))/pb.speed);
  };
  if(el.classList.contains('ai')){if(typing)typing.hidden=false;toBottom();pb.timer=setTimeout(show,900/pb.speed);}
  else show();
}
function startPlay(){
  const els=msgEls();if(!els.length)return;
  els.forEach(e=>{e.hidden=true;e.classList.remove('enter');});
  pb.on=true;pb.paused=false;pb.idx=0;updateBar();step();
}
function stopPlay(silent){
  clearTimeout(pb.timer);pb.on=false;pb.paused=false;
  msgEls().forEach(e=>e.hidden=false);
  const t=$('typing');if(t)t.hidden=true;
  if(!silent)updateBar();
}
$('play').addEventListener('click',()=>{
  if(!pb.on)return startPlay();
  if(pb.paused){pb.paused=false;updateBar();step();}
  else{clearTimeout(pb.timer);pb.paused=true;const t=$('typing');if(t)t.hidden=true;updateBar();}
});
$('stop').addEventListener('click',()=>stopPlay());
$('speed').addEventListener('click',()=>{pb.speed=pb.speed===1?2:pb.speed===2?4:1;$('speed').textContent=pb.speed+'×';});

/* ---------- 导入 ---------- */
async function addConvs(list,label){
  if(!list.length){setStatus(label+'里没有找到带消息的对话。',true);return false;}
  const map=new Map(convs.map(c=>[c.id,c]));
  for(const c of list)map.set(c.id,c);
  convs=[...map.values()].sort((a,b)=>String(b.updated).localeCompare(String(a.updated)));
  activeId=list.length===1?list[0].id:convs[0].id;
  limit=200;$('search').value='';exitSelect(true);
  app.classList.remove('drawer-open');
  refresh(true);
  if(narrow()&&list.length>1)app.classList.add('pane-open');
  const ok=await store.set(convs);
  setStatus('已导入 '+list.length+' 个对话。'+(ok?'下次打开还在。':'这次没能保存到设备，关掉页面后需要重新导入。'),!ok);
  return true;
}
async function importFiles(files){
  const all=[];const bad=[];
  setStatus('正在读取…');
  for(const f of files){try{all.push(...await readFile(f));}catch(e){bad.push(f.name+'：'+e.message);}}
  if(bad.length&&!all.length){setStatus('读取失败。'+bad.join('；')+'。请确认是 Claude 导出的 zip、conversations.json 或接口返回的 JSON。',true);return;}
  const ok=await addConvs(all,'文件');
  if(ok&&bad.length)setStatus('已导入 '+all.length+' 个对话，另有 '+bad.length+' 个文件没读出来：'+bad.join('；'),true);
}
$('pick').addEventListener('click',()=>$('file').click());
$('navImport').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)importFiles(fs);});
$('navPaste').addEventListener('click',()=>{const b=$('pasteBox');b.hidden=!b.hidden;if(!b.hidden)$('paste').focus();});
$('pasteGo').addEventListener('click',async()=>{
  try{const ok=await addConvs(parseText($('paste').value,'粘贴的对话'),'粘贴的内容');if(ok){$('paste').value='';$('pasteBox').hidden=true;}}
  catch(e){setStatus('读取失败：'+e.message+'。请贴入完整的 JSON。',true);}
});
let clearT=null;
$('navClear').addEventListener('click',async()=>{
  const b=$('navClear'),t=$('navClearT');
  if(!convs.length){setStatus('现在没有导入的对话。');return;}
  if(b.dataset.sure!=='1'){b.dataset.sure='1';t.textContent='再点一次，清空 '+convs.length+' 个对话';clearT=setTimeout(()=>{b.dataset.sure='';t.textContent='清空全部对话';},3500);return;}
  clearTimeout(clearT);b.dataset.sure='';t.textContent='清空全部对话';
  convs=[];await store.clear();exitSelect(true);refresh(false);app.classList.remove('drawer-open');
  setStatus('已清空这台设备上保存的对话。');
});
['dragenter','dragover'].forEach(t=>app.addEventListener(t,e=>{e.preventDefault();app.classList.add('drop');}));
['dragleave','drop'].forEach(t=>app.addEventListener(t,e=>{e.preventDefault();app.classList.remove('drop');}));
app.addEventListener('drop',e=>{const fs=[...(e.dataTransfer?e.dataTransfer.files:[])];if(fs.length)importFiles(fs);});

/* ---------- 菜单、列表面板 ---------- */
$('menu').addEventListener('click',()=>app.classList.add('drawer-open'));
$('drawerClose').addEventListener('click',()=>app.classList.remove('drawer-open'));
$('shade').addEventListener('click',()=>app.classList.remove('drawer-open'));
$('shade2').addEventListener('click',()=>app.classList.remove('pane-open'));

$('sort').addEventListener('click',()=>{asc=!asc;renderList();$('list').scrollTop=0;setStatus(asc?'按时间从旧到新':'按时间从新到旧');});

let st=null;
$('searchOpen').addEventListener('click',()=>{$('fabs').hidden=true;$('searchBar').hidden=false;$('search').focus();});
function closeSearch(){$('search').value='';$('searchBar').hidden=true;$('fabs').hidden=selecting;limit=200;renderList();}

/* ---------- 长按多选、删除 ---------- */
let lpT=null,lpFired=false,delT=null;
function updateSel(){$('selCount').textContent='已选择 '+picked.size+' 个';$('selDel').dataset.sure='';}
function enterSelect(id){
  if(!convs.length){setStatus('示例对话不能删除，导入自己的记录后可以长按多选。');return;}
  selecting=true;picked.clear();if(id)picked.add(id);
  $('paneH').hidden=true;$('selH').hidden=false;$('fabs').hidden=true;
  updateSel();renderList();
}
function exitSelect(silent){
  selecting=false;picked.clear();
  $('paneH').hidden=false;$('selH').hidden=true;$('fabs').hidden=!$('searchBar').hidden;
  if(!silent)renderList();
}
const list=$('list');
list.addEventListener('pointerdown',e=>{
  const it=e.target.closest('.item');if(!it||selecting)return;
  lpFired=false;clearTimeout(lpT);
  lpT=setTimeout(()=>{lpFired=true;enterSelect(it.dataset.id);},520);
});
['pointerup','pointercancel','pointerleave'].forEach(t=>list.addEventListener(t,()=>clearTimeout(lpT)));
list.addEventListener('scroll',()=>clearTimeout(lpT),{passive:true});
list.addEventListener('contextmenu',e=>{const it=e.target.closest('.item');if(!it)return;e.preventDefault();clearTimeout(lpT);if(!selecting){lpFired=true;enterSelect(it.dataset.id);}});
list.addEventListener('click',e=>{
  if(e.target.id==='more'){limit+=200;renderList();return;}
  const it=e.target.closest('.item');if(!it)return;
  if(lpFired){lpFired=false;return;}
  if(selecting){
    const id=it.dataset.id;if(picked.has(id))picked.delete(id);else picked.add(id);
    it.classList.toggle('picked',picked.has(id));it.setAttribute('aria-pressed',picked.has(id));updateSel();return;
  }
  select(it.dataset.id);
});
$('selBack').addEventListener('click',()=>exitSelect());
$('selDel').addEventListener('click',async()=>{
  const b=$('selDel');
  if(!picked.size){setStatus('先点选要删除的对话。');return;}
  if(b.dataset.sure!=='1'){b.dataset.sure='1';setStatus('再点一次垃圾桶，从这台设备删除这 '+picked.size+' 个对话。');clearTimeout(delT);delT=setTimeout(()=>{b.dataset.sure='';},4000);return;}
  const n=picked.size;
  convs=convs.filter(c=>!picked.has(c.id));
  exitSelect(true);refresh(true);
  const ok=convs.length?await store.set(convs):(await store.clear(),true);
  setStatus('已删除 '+n+' 个对话。'+(ok?'':'但没能保存到设备，重新打开后可能还会出现。'),!ok);
});

/* ---------- 导出 ---------- */
const pad2=n=>String(n).padStart(2,'0');
function dstr(t){const d=t?new Date(t):new Date();if(isNaN(d))return '';return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function tstr(t){if(!t)return '';const d=new Date(t);if(isNaN(d))return '';return dstr(t)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}
const whoOf=m=>m.role==='user'?'我':m.role==='assistant'?'Claude':m.role==='system'?'系统提示词':'工具结果';
function fence(body){
  let longest=0;(String(body).match(/`+/g)||[]).forEach(r=>{if(r.length>longest)longest=r.length;});
  const f='`'.repeat(Math.max(3,longest+1));return f+'\n'+body+'\n'+f;
}
function toText(c,o,asMd){
  const L=[asMd?'# '+c.title:c.title,[o.time?tstr(c.created):'',c.msgs.length+' 条消息'].filter(Boolean).join(' · '),''];
  for(const m of c.msgs){
    if(m.role==='tool'&&!o.tools)continue;
    const parts=[];
    for(const b of m.blocks){
      if(b.t==='text')parts.push(b.text);
      else if(b.t==='img')parts.push('[图片]');
      else if(b.t==='think'){if(o.think)parts.push(asMd?'> 思考过程\n>\n'+b.text.split('\n').map(x=>'> '+x).join('\n'):'【思考过程】\n'+b.text);}
      else if(!o.tools)continue;
      else if(b.t==='tool'){
        const inp=b.input;const body=inp&&typeof inp==='object'&&typeof inp.content==='string'?inp.content:flat(inp);
        const label='调用工具 · '+b.name+(inp&&inp.title?' · '+inp.title:'');
        parts.push(asMd?'**'+label+'**\n\n'+fence(body):'【'+label+'】\n'+body);
      }
      else if(b.t==='result'){
        const label=(b.err?'工具报错':'工具结果')+(b.name?' · '+b.name:'');
        parts.push(asMd?'**'+label+'**\n\n'+fence(b.text):'【'+label+'】\n'+b.text);
      }
      else if(b.t==='file'){
        const label='附件 · '+b.name;
        parts.push(asMd?'**'+label+'**'+(b.body?'\n\n'+fence(b.body):''):'【'+label+'】'+(b.body?'\n'+b.body:''));
      }
    }
    if(!parts.length)continue;
    const head=whoOf(m)+(o.time&&m.time?' · '+tstr(m.time):'');
    if(asMd)L.push('## '+head,'');else L.push(head+'：');
    L.push(parts.join('\n\n'),'');
  }
  return L.join('\n').trimEnd()+'\n';
}
function toRaw(c){
  return {uuid:c.id,name:c.title,created_at:c.created||'',updated_at:c.updated||'',chat_messages:c.msgs.map(m=>{
    const content=[],attachments=[],files=[];
    for(const b of m.blocks){
      if(b.t==='text')content.push({type:'text',text:b.text});
      else if(b.t==='think')content.push({type:'thinking',thinking:b.text});
      else if(b.t==='tool')content.push({type:'tool_use',name:b.name,input:b.input});
      else if(b.t==='result')content.push({type:'tool_result',name:b.name,content:b.text,is_error:!!b.err});
      else if(b.t==='img'){const mm=/^data:([^;]+);base64,(.*)$/.exec(b.src);if(mm)content.push({type:'image',source:{type:'base64',media_type:mm[1],data:mm[2]}});}
      else if(b.t==='file'){if(b.body)attachments.push({file_name:b.name,extracted_content:b.body});else files.push({file_name:b.name});}
    }
    return {sender:m.role==='user'||m.role==='tool'?'human':m.role,created_at:m.time||'',content,attachments,files};
  })};
}
const safeName=s=>(String(s).replace(/[\\/:*?"<>|#%\u0000-\u001f]/g,'_').replace(/\s+/g,' ').trim().slice(0,60)||'对话');
let expFmt='md';
function expOpts(){return {time:$('oTime').checked,think:$('oThink').checked,tools:$('oTools').checked};}
function expList(){return data().filter(c=>picked.has(c.id));}
function buildFiles(merge){
  const list=expList(),o=expOpts(),ext=expFmt;
  if(!list.length)return [];
  if(merge&&list.length>1){
    let text;
    if(ext==='json')text=JSON.stringify(list.map(toRaw),null,2);
    else if(ext==='md')text='# 导出的对话\n\n'+list.map((c,i)=>(i+1)+'. '+c.title).join('\n')+'\n\n---\n\n'+list.map(c=>toText(c,o,true)).join('\n---\n\n');
    else text='导出的对话\n\n'+list.map((c,i)=>(i+1)+'. '+c.title).join('\n')+'\n\n————————————\n\n'+list.map(c=>toText(c,o,false)).join('\n————————————\n\n');
    return [{name:'对话导出_'+dstr()+'_'+list.length+'个.'+ext,text}];
  }
  const used=new Set();
  return list.map(c=>{
    const base=safeName(c.title)+(dstr(c.updated||c.created)?'_'+dstr(c.updated||c.created):'');
    let name=base,k=2;while(used.has(name))name=base+' ('+(k++)+')';used.add(name);
    const text=ext==='json'?JSON.stringify(toRaw(c),null,2):toText(c,o,ext==='md');
    return {name:name+'.'+ext,text};
  });
}
const MIME={md:'text/markdown',txt:'text/plain',json:'application/json'};
const nativeExport=()=>!!(window.NativeBridge&&NativeBridge.saveFiles&&NativeBridge.shareFiles);
function syncSheet(){
  const n=picked.size;
  $('sheetT').textContent='导出 '+n+' 个对话';
  [...$('fmt').children].forEach(b=>b.setAttribute('aria-checked',String(b.dataset.v===expFmt)));
  const isJson=expFmt==='json';
  ['oTime','oThink','oTools'].forEach(id=>{$(id).disabled=isJson;$(id).closest('.sw').classList.toggle('off',isJson);});
  $('oMergeRow').hidden=n<2;
  const nat=nativeExport();
  $('expSave').hidden=!nat;$('expShare').hidden=!nat;
  $('sheetHint').textContent=(isJson?'JSON 保留全部内容，可以再导入回来。':'')+(nat?(n>1&&!$('oMerge').checked?'保存时选一个文件夹，'+n+' 个文件会写进去。':''):'网页版不能保存文件，只能复制全文。安装的应用里可以保存和分享。');
}
function openSheet(){if(!picked.size){setStatus('先点选要导出的对话。');return;}syncSheet();$('sheetShade').hidden=false;$('sheet').hidden=false;}
function closeSheet(){$('sheetShade').hidden=true;$('sheet').hidden=true;}
$('selExp').addEventListener('click',openSheet);
$('sheetShade').addEventListener('click',closeSheet);
$('fmt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;expFmt=b.dataset.v;syncSheet();});
$('oMerge').addEventListener('change',syncSheet);
function sendNative(kind){
  try{
    const files=buildFiles($('oMerge').checked);
    if(!files.length)return;
    NativeBridge[kind](JSON.stringify(files),MIME[expFmt]);
    closeSheet();exitSelect();
  }catch(e){setStatus('导出失败：'+e.message+'。对话太大时请少选几个再试。',true);}
}
$('expSave').addEventListener('click',()=>sendNative('saveFiles'));
$('expShare').addEventListener('click',()=>sendNative('shareFiles'));
$('expCopy').addEventListener('click',async()=>{
  const files=buildFiles(true);if(!files.length)return;
  const text=files[0].text;
  try{
    if(window.NativeBridge&&NativeBridge.copy)NativeBridge.copy(text);else await navigator.clipboard.writeText(text);
    closeSheet();exitSelect();setStatus('已复制全文');
  }catch(e){setStatus('复制失败，内容可能太长。',true);}
});

/* ---------- 复制 ---------- */
$('thread').addEventListener('click',async e=>{
  const b=e.target.closest('[data-copy]');if(!b)return;
  let text='';
  if(b.dataset.copy==='code'){const pre=b.closest('.code').querySelector('pre');text=pre?pre.textContent:'';}
  else text=copyMap.get(+b.dataset.copy)||'';
  if(window.NativeBridge&&NativeBridge.copy){NativeBridge.copy(text);setStatus('已复制');return;}
  try{await navigator.clipboard.writeText(text);setStatus('已复制');}
  catch(err){setStatus('复制失败，请长按文字手动选择。',true);}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!$('sheet').hidden){closeSheet();return;}
  if(app.classList.contains('drawer-open'))app.classList.remove('drawer-open');
  else if(selecting)exitSelect();
  else app.classList.remove('pane-open');
});

/* 安卓返回键：先收起最上面的一层，都收起了才退出 */
window.__appBack=function(){
  if(!$('sheet').hidden){closeSheet();return true;}
  if(app.classList.contains('drawer-open')){app.classList.remove('drawer-open');return true;}
  if(selecting){exitSelect();return true;}
  if(!$('searchBar').hidden){closeSearch();return true;}
  if(app.classList.contains('pane-open')){app.classList.remove('pane-open');return true;}
  if(pb.on){stopPlay();return true;}
  return false;
};
(async()=>{
  refresh(false);
  const saved=await store.get();
  if(Array.isArray(saved)&&saved.length){convs=saved;refresh(false);}
})();
